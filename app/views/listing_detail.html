{% extends "base.html" %}

{% block title %}{{ listing.title }} - RentalHub{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden border border-gray-200 mt-6">
    <div class="p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">{{ listing.title }}</h1>
        <p class="text-xl font-semibold text-blue-600 mb-4">${{ listing.price_per_day }} / day</p>
        <p class="text-gray-600 mb-6">{{ listing.description }}</p>

        <hr class="my-6 border-gray-200" />

        <h3 class="text-xl font-bold text-gray-800 mb-4">Book this Item</h3>
        <div id="booking-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm"></div>
        <div id="booking-success" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-2 rounded mb-4 text-sm"></div>

        <form id="booking-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">Start Date</label>
                <input type="date" id="start_date" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-gray-700 font-medium text-sm mb-1">End Date</label>
                <input type="date" id="end_date" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="md:col-span-2">
                <button type="submit" class="w-full bg-green-600 text-white font-medium py-3 rounded-lg hover:bg-green-700 transition duration-200">
                    Confirm Booking
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('booking-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('access_token');
    const errorDiv = document.getElementById('booking-error');
    const successDiv = document.getElementById('booking-success');
    
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');

    if (!token) {
        errorDiv.textContent = 'Please login first to place a booking.';
        errorDiv.classList.remove('hidden');
        return;
    }

    const payload = {
        listing_id: parseInt("{{ listing.id }}"),
        start_date: document.getElementById('start_date').value,
        end_date: document.getElementById('end_date').value
    };

    try {
        const response = await fetch('/api/rentals/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
            successDiv.textContent = 'Booking successful!';
            successDiv.classList.remove('hidden');
        } else {
            errorDiv.textContent = data.detail || 'Failed to place booking';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = 'Server connection error';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}

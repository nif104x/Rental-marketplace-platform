{% extends "base.html" %}

{% block title %}Login - RentalHub{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-200 mt-10">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login to RentalHub</h2>
    
    <div id="error-message" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm"></div>

    <form id="login-form" class="space-y-4">
        <div>
            <label class="block text-gray-700 font-medium text-sm mb-1">Email Address</label>
            <input type="email" id="email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="lessor@example.com">
        </div>
        <div>
            <label class="block text-gray-700 font-medium text-sm mb-1">Password</label>
            <input type="password" id="password" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition duration-200">
            Sign In
        </button>
    </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('error-message');
    errorDiv.classList.add('hidden');

    // OAuth2PasswordRequestForm expects x-www-form-urlencoded data
    const formData = new URLSearchParams();
    formData.append('username', document.getElementById('email').value);
    formData.append('password', document.getElementById('password').value);

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/x-www-form-urlencoded' 
            },
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            localStorage.setItem('access_token', data.access_token);
            window.location.href = '/';
        } else {
            errorDiv.textContent = data.detail || 'Invalid email or password';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = 'Server connection error';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}

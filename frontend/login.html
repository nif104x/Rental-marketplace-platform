<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - RentHub</title>
  <style>
    :root {
      --primary: #0066ff;
      --primary-hover: #0052cc;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 20px; font-weight: 700; color: var(--primary); text-decoration: none; }
    
    .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; }
    .btn-outline { border-color: var(--border); background: transparent; color: var(--text-main); }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; padding: 12px; font-size: 14px; margin-top: 10px; }
    .btn-primary:hover { background: var(--primary-hover); }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .login-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); }
    .card-header { margin-bottom: 24px; text-align: center; }
    .card-header h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .card-header p { font-size: 14px; color: var(--text-muted); }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type="email"], input[type="password"] { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--primary); }

    .alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px; display: none; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

    .card-footer { margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-muted); }
    .card-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">📦 RentHub</a>
      <a href="signup.html" class="btn btn-outline">Sign Up</a>
    </div>
  </header>

  <main>
    <div class="login-card">
      <div class="card-header">
        <h1>Sign In</h1>
        <p>Access your rental dashboard</p>
      </div>

      <div id="alertBox" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="emailInput">Email Address</label>
          <input type="email" id="emailInput" required placeholder="name@example.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">Sign In</button>
      </form>

      <div class="card-footer">
        Don't have an account? <a href="signup.html">Create an account</a>
      </div>
    </div>
  </main>

  <script>
    const API_BASE_URL = window.location.origin.includes(":8000") ? "" : "http://127.0.0.1:8000";

    // Auto-redirect if already logged in based on stored role
    const savedToken = localStorage.getItem("access_token");
    const savedRole = localStorage.getItem("role");

    if (savedToken) {
      if (savedRole === "admin") {
        window.location.replace("admin.html");
      } else {
        window.location.replace("dashboard.html");
      }
    }

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const alertBox = document.getElementById("alertBox");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.innerText = "Signing in...";

      const payload = {
        email: emailInput.value.trim(),
        password: passwordInput.value
      };

      try {
        let res = await fetch(`${API_BASE_URL}/login/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.status === 404) {
          res = await fetch(`${API_BASE_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Invalid email or password.");
        }

        // Store user authentication state
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("token_type", data.token_type || "bearer");
        localStorage.setItem("user_id", data.user_id);
        localStorage.setItem("role", data.role || "user");

        alertBox.className = "alert alert-success";
        alertBox.innerText = `Welcome back! Redirecting to ${data.role === 'admin' ? 'Admin Portal' : 'Dashboard'}...`;
        alertBox.style.display = "block";

        // Role-based routing
        setTimeout(() => {
          if (data.role === "admin") {
            window.location.replace("admin.html");
          } else {
            window.location.replace("dashboard.html");
          }
        }, 500);

      } catch (err) {
        alertBox.className = "alert alert-error";
        alertBox.innerText = err.message;
        alertBox.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Sign In";
      }
    });
  </script>
</body>
</html>

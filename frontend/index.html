<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Marketplace - Explore Listings</title>
  <style>
    :root {
      --primary: #0066ff;
      --primary-hover: #0052cc;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      border-color: var(--border);
      background: transparent;
      color: var(--text-main);
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }

    /* Search & Filter Header */
    .hero {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 40px 24px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 24px;
    }

    .search-bar {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      background: var(--bg);
      padding: 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .search-bar input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: transparent;
      font-size: 15px;
      outline: none;
    }

    /* Category Chips */
    .categories {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip.active, .chip:hover {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    /* Content Area */
    main {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px;
      flex: 1;
      width: 100%;
    }

    .listings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
    }

    .card-img-container {
      width: 100%;
      height: 200px;
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-location {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .price-tag {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .price-tag span {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
    }

    .state-msg {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">📦 RentHub</a>
      <div class="nav-actions" id="navAuthArea">
        <a href="login.html" class="btn btn-outline">Sign In</a>
        <a href="signup.html" class="btn btn-primary">Sign Up</a>
      </div>
    </div>
  </header>

  <!-- Search & Discovery Banner -->
  <section class="hero">
    <h1>Find whatever you need, whenever you need it</h1>
    <p>Rent electronics, cameras, tools, and equipment directly from local verified owners.</p>
    
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Try searching for 'Sony Camera' or 'Drill'..." />
      <button class="btn btn-primary" onclick="handleSearch()">Search</button>
    </div>

    <div class="categories" id="categoryChips">
      <div class="chip active" data-cat="all">All Items</div>
      <div class="chip" data-cat="electronics">Electronics</div>
      <div class="chip" data-cat="cameras">Cameras</div>
      <div class="chip" data-cat="tools">Tools</div>
      <div class="chip" data-cat="vehicles">Vehicles</div>
    </div>
  </section>

  <!-- Listings Feed -->
  <main>
    <div class="listings-header">
      <h2 id="feedTitle">Available Rentals</h2>
      <span id="itemsCount" style="color: var(--text-muted); font-size: 14px;">Loading items...</span>
    </div>

    <div class="grid" id="listingsGrid">
      <div class="state-msg">Loading listings from server...</div>
    </div>
  </main>

  <script>
    const API_BASE_URL = "http://127.0.0.1:8000";
    let allListings = [];
    let selectedCategory = "all";

    // 1. Setup Auth state in Header
    function syncAuthUI() {
      const token = localStorage.getItem("access_token");
      const authArea = document.getElementById("navAuthArea");

      if (token) {
        authArea.innerHTML = `
          <a href="create-listing.html" class="btn btn-primary">+ Post Listing</a>
          <button class="btn btn-outline" onclick="logout()">Sign Out</button>
        `;
      }
    }

    function logout() {
      localStorage.removeItem("access_token");
      localStorage.removeItem("token_type");
      window.location.reload();
    }

    // 2. Fetch listings from FastAPI
    async function loadListings() {
      const grid = document.getElementById("listingsGrid");
      const counter = document.getElementById("itemsCount");

      try {
        const response = await fetch(`${API_BASE_URL}/listings`);
        if (!response.ok) throw new Error("Failed to load listings");
        
        const data = await response.json();
        
        // Supports paginated shape { items: [...] } or flat array [...]
        allListings = Array.isArray(data) ? data : (data.items || []);
        
        counter.innerText = `${allListings.length} items available`;
        renderListings(allListings);
      } catch (err) {
        grid.innerHTML = `
          <div class="state-msg">
            <p>Could not reach the backend API at <code>${API_BASE_URL}</code>.</p>
            <p style="margin-top: 8px; font-size: 13px;">Make sure uvicorn is running and CORS is enabled.</p>
          </div>
        `;
        counter.innerText = "0 items";
      }
    }

    // 3. Render cards into grid
    function renderListings(list) {
      const grid = document.getElementById("listingsGrid");

      if (list.length === 0) {
        grid.innerHTML = `<div class="state-msg">No listings match your search or filter.</div>`;
        return;
      }

      grid.innerHTML = list.map(item => {
        // Fallback placeholder image if none exists
        const img = item.primary_image || (item.images && item.images[0]?.image_file_url) || "https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?w=600&auto=format&fit=crop&q=80";
        const location = item.geo_location || "Location on request";
        const rate = item.rental_rate_daily ? `$${parseFloat(item.rental_rate_daily).toFixed(2)}` : "$--";
        const category = item.category || "General";

        return `
          <div class="card" onclick="openDetail('${item.listing_id}')">
            <div class="card-img-container">
              <span class="card-badge">${category}</span>
              <img class="card-img" src="${img}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1581235720704-06d3acfcb36f?w=600&auto=format&fit=crop&q=80'" />
            </div>
            <div class="card-body">
              <div class="card-title" title="${item.title}">${item.title}</div>
              <div class="card-location">📍 ${location}</div>
              <div class="card-footer">
                <div class="price-tag">${rate} <span>/ day</span></div>
                <span style="font-size: 13px; color: var(--primary); font-weight: 600;">Rent &rarr;</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // 4. Filters & Search Handlers
    function handleSearch() {
      const term = document.getElementById("searchInput").value.trim().toLowerCase();
      applyFilters(term, selectedCategory);
    }

    document.getElementById("searchInput").addEventListener("keyup", (e) => {
      if (e.key === "Enter") handleSearch();
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        selectedCategory = chip.getAttribute("data-cat");
        const term = document.getElementById("searchInput").value.trim().toLowerCase();
        applyFilters(term, selectedCategory);
      });
    });

    function applyFilters(searchTerm, category) {
      let filtered = allListings;

      if (category !== "all") {
        filtered = filtered.filter(item => (item.category || "").toLowerCase() === category.toLowerCase());
      }

      if (searchTerm) {
        filtered = filtered.filter(item => 
          (item.title || "").toLowerCase().includes(searchTerm) ||
          (item.description || "").toLowerCase().includes(searchTerm) ||
          (item.geo_location || "").toLowerCase().includes(searchTerm)
        );
      }

      renderListings(filtered);
    }

    function openDetail(listingId) {
      window.location.href = `listing-detail.html?id=${listingId}`;
    }

    // Initialize
    syncAuthUI();
    loadListings();
  </script>
</body>
</html>
